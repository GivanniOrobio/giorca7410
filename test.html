<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Collection Renderer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            margin: 40px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .section h2 {
            margin-top: 0;
            color: #333;
        }
        .post, .doctor, .info-item, .config-item, .slider-item {
            padding: 15px;
            margin: 10px 0;
            background: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test Collection Renderer</h1>
    
    <!-- header-top section -->
    <div class="section">
        <h2>Header Top (config/header)</h2>
        <div data-collection data-area="config" data-elemento="header" data-template="#template-header">
        </div>
    </div>

    <!-- about section -->
    <div class="section">
        <h2>About (info/about)</h2>
        <div data-collection data-area="info" data-elemento="about" data-template="#template-about">
        </div>
    </div>

    <!-- services/series section -->
    <div class="section">
        <h2>Servicios/Features (info/servicios)</h2>
        <div data-collection data-area="info" data-elemento="servicios" data-template="#template-servicios">
        </div>
    </div>

    <!-- doctores section -->
    <div class="section">
        <h2>Doctores (doctores)</h2>
        <div data-collection data-area="doctores" data-elemento="doctores" data-template="#template-doctor">
        </div>
    </div>

    <!-- sliders section -->
    <div class="section">
        <h2>Sliders (sliders/hero)</h2>
        <div data-collection data-area="sliders" data-elemento="hero" data-template="#template-slider">
        </div>
    </div>

    <!-- Templates -->
    <template id="template-header">
        <div class="config-item">
            <h3 data-field="descripcion"></h3>
            <p><strong>Correo:</strong> <span data-field="correo"></span></p>
            <p><strong>Dirección:</strong> <span data-field="direccion"></span></p>
            <p><strong>Horario:</strong> <span data-field="horario"></span></p>
        </div>
    </template>

    <template id="template-about">
        <div class="info-item">
            <h3 data-field="title"></h3>
            <p data-field="description"></p>
        </div>
    </template>

    <template id="template-servicios">
        <div class="info-item">
            <h3 data-field="title"></h3>
            <p data-field="description"></p>
        </div>
    </template>

    <template id="template-doctor">
        <div class="doctor">
            <h3 data-field="name"></h3>
            <p><strong>Especialidad:</strong> <span data-field="specialty"></span></p>
            <p><strong>Email:</strong> <span data-field="email"></span></p>
            <p><strong>Teléfono:</strong> <span data-field="phone"></span></p>
            <p><strong>Experiencia:</strong> <span data-field="experience"></span></p>
        </div>
    </template>

    <template id="template-slider">
        <div class="slider-item">
            <h3 data-field="title"></h3>
            <p data-field="description"></p>
            <p><strong>Subtítulo:</strong> <span data-field="sub-title"></span></p>
        </div>
    </template>

    <template id="post-template">
        <article class="post">
            <h2 data-field="title"></h2>
            <p data-field="description"></p>
            <span data-field="date"></span>
        </article>
    </template>

    <script src="assset/CRUD/admin.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const collections = new CollectionManager();
            collections.iniciar();
        });
    </script>
</body>
</html>
